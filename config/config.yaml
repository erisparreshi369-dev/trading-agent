# Runtime configuration. Secrets do NOT go here; they live in .env.
# Risk limits are deliberately NOT in this file: they are in trader/src/risk/limits.ts (the dashboard's Limits tab
# may change them, inside the walls there). Values marked in shared/editable-settings.json can also be changed there.
# The loader rejects unknown sections, so a `risk:` block here is an error, not a silent no-op.

collector:
  helius:
    # Every Helius websocket byte is metered (20 credits/MB). Helius's real limit is per MONTH
    # (Free: 1M credits); when it's used up Helius refuses everything until the month resets.
    # This is OUR per-UTC-day share of it: 1500 MB = 30k credits/day = 930k/month, leaving room
    # for RPC calls. Developer plan (10M/month): ~15000. Measured full firehose: ~35 GB/day.
    daily_mb_cap: 1500
    # The dashboard can raise the daily cap (stored in the database until you change it back).
    # Whatever the cap, a monthly guard holds: over any 31 days the streams never use more than
    # stream_share of monthly_credits (the rest stays for RPC calls), so the plan's monthly credits
    # can't run out whatever day Helius resets them. Raising the cap one day leaves less for the next.
    monthly_credits: 1000000      # Free plan
    credits_per_mb: 20
    stream_share: 0.9
    # Lighter data modes as the day's budget runs down (and a Telegram warning at each step):
    #   1st: firehose off (no new-wallet discovery), no pool watching after migration
    #   2nd: only tracked wallets, tokens they traded in the last 30 min, and open trades
    #   3rd: only open trades; no new trades until 00:00 UTC
    # Open trades stay watched until they close, even past 100%.
    steps_pct: [70, 85, 95]

  firehose:
    # Full pump.fun stream, used to DISCOVER wallets. Runs inside these UTC hours until its share
    # of the budget is spent. [0, 24] = all day (needs a paid plan).
    enabled: true
    hours_utc: [14, 24]

  targeted:
    # Per-address Helius subscriptions, cheap and on all day: tracked wallets, tokens they buy,
    # tokens we hold, PumpSwap pools of migrated tokens we care about.
    enabled: true
    token_watch_minutes: 60     # keep watching a token's curve this long after a tracked wallet trades it
    pool_watch_hours: 2         # after migration (was 48: watching hot pools was the biggest Helius data user; we only buy before migration)
    max_subscriptions: 900      # Helius Free allows 1000 per connection

  # Free PumpPortal streams: every new token (with creator + dev buy) and every migration.
  pumpportal_streams: true

  bars:
    fine_bucket_ms: 5000        # bar width during the first fine_window
    fine_window_ms: 3600000     # first hour
    coarse_bucket_ms: 60000     # bar width afterwards
    coarse_window_ms: 86400000  # stop bars after 24h

  holder_checks:
    # On-chain largest-holder checks (RPC) during firehose hours, for active tokens only.
    enabled: true
    min_trades: 25
    ages_s: [60, 300, 900, 1800, 3600]
    max_per_minute: 30

  retention:
    # 0 = keep forever: the owner wants the bot (and its learning brain) to never forget anything.
    # ~100-150 MB a day at most with the free data limit; set a number of days to delete older rows.
    raw_trades_days: 0          # trades by tracked wallets are always kept, whatever this says
    holders_days: 0

  heartbeat_s: 30
  stale_stream_s: 60

scoring:
  lookback_days: 7
  min_positions: 8              # closed, fully observed positions needed to be scored
  min_copy_trades: 30           # simulated follower trades needed before a wallet can be followed
  max_tokens_per_day: 300       # more than this looks like a bot / volume farmer
  snipe_window_slots: 2         # entries this close to launch can't be copied
  max_snipe_pnl_frac: 0.5       # reject if more than this share of profit came from snipes
  min_median_hold_s: 20         # faster round-trips can't be copied with our delay
  copy_size_sol: 0.02           # follower size used in the copy simulation
  min_copy_roi: 0.0             # mean simulated follower ROI must beat this (after all costs)
  copy_roi_cap: 1.0             # cap each trade's ROI at +100% before averaging: one 10x shouldn't carry a losing wallet
  track_top_n: 25
  cold_after_hours: 48          # tracked wallet with no trades for this long is dropped
  oos_days: 2                   # out-of-sample check: score on the older days, measure on the newest oos_days

signals:
  venues: [curve]               # add amm to follow buys after migration
  min_leader_buy_sol: 0.1
  token_age_s: [3, 1800]
  min_real_sol: 1.0             # SOL actually in the curve
  max_real_sol: 75              # near completion = migration whipsaw
  max_top10_pct: 40             # % of supply held by the top 10 wallets, curve excluded
  max_dev_hold_pct: 10
  max_dev_sold_frac: 0.5        # dev has sold more than this share of their launch buy
  max_dev_tokens_24h: 5         # serial launchers
  exclude_mayhem: true
  min_confirmations: 1          # tracked wallets buying this token within the window (incl. leader)
  confirmation_window_s: 120
  reentry_cooldown_s: 3600
  min_score: 0.0               # signal score = wallet's shrunk simulated follower ROI (+ confirmations bonus)
  # Creator check, from creator records the daily MadeOnSol job stored BEFORE the decision (the
  # engine only reads our database). Off for practice trades: the shadow variant creator_check
  # measures it first, and the weekly report compares the two.
  exclude_bad_creators: false
  bad_creator_min_launches: 10  # a creator with at least this many launches...
  bad_creator_max_success: 0.01 # ...of which at most this share filled their curve, is "bad"
  # The learning brain: once its newest model passed the exam (brain: below), skip signals it
  # predicts will lose. It can only make the bot pickier. Its exam and its own-skips record judge it.
  use_brain: true

paper:
  start_balance_sol: 1.0
  execution_delay_ms: 1500      # from the leader's trade landing to our order landing
  priority_fee_sol: 0.0003      # per transaction
  executor_fee_bps: 50          # PumpPortal Local API fee, charged both ways
  extra_slippage_bps: 50        # same-slot competition the replay can't see
  # Max slippage, in bps (100 bps = 1%): how much higher than the copied wallet our buy price may be.
  # More than this and we skip the buy ("skipped: price moved too much"). Sells are never blocked:
  # we always exit, and the slippage is logged. The learner may lower this, never raise it.
  max_slippage_bps: 300         # 3%
  token_account_rent_sol: 0.00203928  # paid on first buy, refunded when the account is closed on exit
  follow_leader_exit: true      # sell when the leader sells

shadow:
  # Every signal is also paper-traded under each variant below, in parallel, at a fixed size and
  # without balance or portfolio limits (open positions, daily caps, wallet share): each variant
  # measures a rule, not a portfolio. The hard stop loss and 30-min time exit always apply.
  # Results are settled from the recorded tape once the outcome is known (at most ~32 min later).
  # A variant is the live settings plus its overrides:
  #   filters: any `signals:` key, or `none` (take every signal, rejected ones included)
  #   exit:    leader_exit, take_profit_pct, trailing_stop_pct (from the peak), max_hold_s (<= 1800)
  #   size_sol
  #   max_slippage_bps (instead of paper.max_slippage_bps)
  # Loosening a filter means more signals get the on-chain checks (2 RPC credits each).
  enabled: true
  size_sol: 0.02
  variants:
    live: {}                                             # = live settings: checks the shadow sim against real paper trades
    all_signals: { filters: none }                       # what following everything would have done
    tp_50: { exit: { take_profit_pct: 50 } }             # leader exit or +50%, whichever first
    tp_100: { exit: { take_profit_pct: 100 } }
    trail_20: { exit: { leader_exit: false, trailing_stop_pct: 20 } }
    trail_35: { exit: { leader_exit: false, trailing_stop_pct: 35 } }
    hold_1m: { exit: { leader_exit: false, max_hold_s: 60 } }
    hold_5m: { exit: { leader_exit: false, max_hold_s: 300 } }
    buy_0.05: { filters: { min_leader_buy_sol: 0.05 } }
    buy_0.5: { filters: { min_leader_buy_sol: 0.5 } }
    age_2m: { filters: { token_age_s: [3, 120] } }
    conf_2: { filters: { min_confirmations: 2 } }
    top10_60: { filters: { max_top10_pct: 60 } }
    size_0.05: { size_sol: 0.05 }                        # cost share vs size
    size_0.1: { size_sol: 0.1 }
    size_0.25: { size_sol: 0.25 }
    no_slip_limit: { max_slippage_bps: 100000 }          # what the trades skipped for slippage would have done (weekly report)
    creator_check: { filters: { exclude_bad_creators: true } }   # live settings + skip coins from bad creators (weekly report)

notifier:
  watch_services: [collector, trader, brain]  # alert if one of these stops reporting
  stale_after_s: 300
  daily_summary_utc: "00:05"          # daily report covering the previous UTC day
  trade_alerts: true                  # a message for every trade we follow (skipped ones go in the hourly summary)
  timezone: UTC                       # clock times in messages, e.g. Europe/London; daily limits still reset at 00:00 UTC
  usd_prices: true                    # show dollar amounts next to SOL (SOL price from CoinGecko, refreshed every 10 min)
  voice: genz-short                   # how messages sound: genz (notifier/messages-genz.ts) or plain (notifier/messages.ts); add -short for one line per message (notifier/messages-short.ts)

providers:
  # Where market data comes from. Keys live in .env (key_env names the variable); a provider whose
  # key is missing is simply not used. {key} in an address is replaced by the key.
  list:
    helius: { key_env: HELIUS_API_KEY, ws: "wss://mainnet.helius-rpc.com/?api-key={key}", http: "https://mainnet.helius-rpc.com/?api-key={key}" }
    drpc:   { key_env: DRPC_API_KEY,   ws: "wss://lb.drpc.org/ogws?network=solana&dkey={key}", http: "https://lb.drpc.org/ogrpc?network=solana&dkey={key}" }
    ankr:   { key_env: ANKR_API_KEY,   ws: "wss://rpc.ankr.com/solana/ws/{key}", http: "https://rpc.ankr.com/solana/{key}" }
  # Which providers each job may use, best first. failover = use the first healthy one.
  # (Step 2 adds mode "redundant" for following: listen on two at once, keep the first copy.)
  jobs:
    following: { use: [helius, drpc, ankr], mode: failover }  # traders we copy, their coins, our open trades
    discovery: { use: [helius], mode: failover }              # the full stream; too big for the free backups
    lookups:   { use: [helius, drpc, ankr], mode: failover }  # holder and safety checks
    history:   { use: [helius], mode: failover }              # only Helius has the cheap history method
  health:
    errors_in_a_row: 3         # this many failures in a row = unhealthy
    timeout_s: 10              # a request slower than this counts as a failure
    silent_s: 60               # a live stream with no message for this long = unhealthy
    budget_pct: 90             # a provider past this share of its daily budget = unhealthy
    switch_back_after_healthy_s: 120   # go back to a better provider only after it's been healthy this long

madeonsol:
  # Optional helper (madeonsol.com, key MADEONSOL_API_KEY in .env; without it nothing happens).
  # Only the daily intel job (systemd timer trading-intel, 00:02 UTC) calls it: creator records,
  # early-buyer scores, ranked wallets. It is NEVER called while deciding a trade.
  enabled: true
  key_env: MADEONSOL_API_KEY
  base_url: https://madeonsol.com/api/v1
  daily_requests: 200           # free plan (a batch of up to 50 coins = 1 request)
  warn_pct: 70                  # Telegram message at this share of the day's requests
  stop_pct: 90                  # the job stops here (another message), keeping the rest for you
  timeout_s: 10                 # per request
  per_minute: 30                # free plan allows 60
  creator_batches: 60           # extra batches of 50 coins from creators who launch often
  candidates:
    watch_top: 20               # ranked wallets whose trades we watch, so OUR scoring can judge them
    watch_days: 7               # each candidate gets one 7-day trial
    min_hold_minutes: 1         # traders faster than this can't be copied with our delay

brain:
  # The learning brain (learner/brain.py --watch, service trading-brain; `make brain` studies once).
  # Every time a trade's result is known it studies every signal ever recorded with what following
  # it would have made (shadow variant all_signals: the bot's own trades and the ones it skipped),
  # remembers every model and lesson in the database, and writes what it learned. It may make the
  # bot skip a signal only after passing an exam on signals it never trained on, re-taken every study:
  min_signals: 200          # studied signals with a known outcome, before it may take the exam
  min_test_trades: 30       # trades the normal rules took inside the newest test_share of signals
  test_share: 0.3           # newest 30% held out as the exam; it trains on the older 70%
  min_gain: 0.02            # trades it keeps must beat all the rules' trades by 2 points of ROI on average...
  min_kept: 10              # ...while keeping at least this many test trades...
  skip_below_roi: 0.0       # ...and it skips a signal when its predicted follower ROI is below this
  ridge: 10                 # how hard it resists over-fitting few examples (bigger = more careful)
  lesson_min_n: 15          # a lesson needs this many signals on each side
  lesson_min_diff: 0.02     # ...and a difference of at least 2 points to count as "better" or "worse"
  own_skips_min: 10         # once it really skipped this many signals, they must have lost money on average, or it fails the exam

youtube:
  # The brain studies YouTube (learner/youtube.py, nightly 00:20 UTC, or `make youtube`): talks and
  # interviews of well-known traders, subtitles only (free, no key, no AI). It counts which trading
  # rules they talk about and checks each against our own shadow results. Videos never change what
  # the bot does. YouTube blocks fast downloads, so it goes slowly and carries on the next night.
  enabled: true
  per_search: 5              # results looked at per search
  max_videos: 15             # new videos per night at most
  sleep_s: 8                 # pause between downloads
  max_duration_min: 240      # skip longer videos (livestreams)
  min_n: 30                  # trades our data needs before it judges a rule
  min_diff: 0.02             # ...and a difference of at least 2 points of follower ROI
  traders:                   # searched as "<name> trading interview", one turn each, rotating nightly
    - Paul Tudor Jones
    - Stanley Druckenmiller
    - Mark Minervini
    - Peter Brandt
    - Linda Raschke
    - Ed Seykota
    - Jesse Livermore
    - William O'Neil
    - Jack Schwager Market Wizards
    - Chat With Traders
    - SMB Capital
    - Kristjan Kullamagi
  topics:                    # plain searches, a smaller part of the mix
    - professional trader risk management
    - crypto trader interview strategy
    - solana memecoin trading strategy
